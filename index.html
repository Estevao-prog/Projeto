<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema Solar</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #instrucoes {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #cccccc;
      font-family: sans-serif;
      font-size: 13px;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
    }
    #painelInfo {
      position: fixed;
      top: 16px;
      right: 16px;
      max-width: 240px;
      color: #ffffff;
      font-family: sans-serif;
      background: rgba(10, 15, 25, 0.75);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 12px 14px;
      display: none; /* só aparece quando um corpo é selecionado */
      pointer-events: none;
    }
    #painelInfo h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
    }
    #painelInfo p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: #dddddd;
    }
  </style>
</head>
<body>
  <div id="instrucoes">WASD: mover a sonda &nbsp;|&nbsp; Clique: selecionar um planeta</div>
  <div id="painelInfo">
    <h3 id="painelInfoTitulo"></h3>
    <p id="painelInfoTexto"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>

    // Cenas, cameras e rederizadores.

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    // câmera afastada e um pouco de cima, pra ver o sistema todo alinhado
    camera.position.set(0, 24, 42);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Utilização de OrbitControls para permitir interação com o sistema
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;   // Deixa o movimento mais suave.
    controls.dampingFactor = 0.05;
    controls.minDistance = 5;        // Impede de dar zoom até dentro do sol
    controls.maxDistance = 80;       // Não permite afastar demais a camera e perder a visão do sistema

    // Relógio para animações baseadas em tempo decorrido (Math.sin)
    const relogio = new THREE.Clock();

    // Iluminação da cena que parte do proprio sol
    const luzSol = new THREE.PointLight(0xffffff, 2, 100);
    luzSol.position.set(0, 0, 0);
    scene.add(luzSol);
    scene.add(new THREE.AmbientLight(0x404040)); // luz de preenchimento, senão o lado escuro fica 100% preto


    // Geometrias

    // Geometria 1: esfera -> usada no Sol e em todos os planetas
    const esferaGeo = new THREE.SphereGeometry(1, 24, 24);

    // Geometria 2: torus (anel) -> usada no anel de Saturno
    const anelGeo = new THREE.TorusGeometry(2, 0.3, 8, 40);

    // Linhas finas que tornam os caminhos orbitais visíveis.
    const matOrbita = new THREE.LineBasicMaterial({ color: 0x557080, transparent: true, opacity: 0.45 });

    function criarOrbita(raio) {
      const pontos = [];
      for (let i = 0; i < 128; i++) {
        const angulo = (i / 128) * Math.PI * 2;
        pontos.push(new THREE.Vector3(Math.cos(angulo) * raio, 0, Math.sin(angulo) * raio));
      }
      const orbita = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pontos), matOrbita);
      scene.add(orbita);
    }


    // Texturas: uma para cada corpo do sistema
    const texLoader     = new THREE.TextureLoader();
    const texturaSol      = texLoader.load('sol.jpg');
    const texturaMercurio = texLoader.load('mercurio.jpg');
    const texturaVenus    = texLoader.load('venus.jpg');
    const texturaTerra    = texLoader.load('terra.jpg');
    const texturaMarte    = texLoader.load('marte.jpg');
    const texturaJupiter  = texLoader.load('jupiter.jpg');
    const texturaSaturno  = texLoader.load('saturno.jpg');
    const texturaAnel     = texLoader.load('anel.jpg');
    const texturaUrano    = texLoader.load('urano.jpg');
    const texturaNetuno   = texLoader.load('netuno.jpg');

    // Materiais

    const matSol      = new THREE.MeshBasicMaterial({ map: texturaSol, color: 0xffdd00 }); // Sol emite luz própria, não reage à luz
    const matMercurio  = new THREE.MeshStandardMaterial({ map: texturaMercurio, color: 0xaaaaaa });
    const matVenus     = new THREE.MeshStandardMaterial({ map: texturaVenus, color: 0xe0c16c });
    const matTerra     = new THREE.MeshStandardMaterial({ map: texturaTerra, color: 0xffffff });
    const matMarte     = new THREE.MeshStandardMaterial({ map: texturaMarte, color: 0xff4500 });
    const matJupiter    = new THREE.MeshStandardMaterial({ map: texturaJupiter, color: 0xd2a679 });
    const matSaturno   = new THREE.MeshStandardMaterial({ map: texturaSaturno, color: 0xf5deb3 });
    const matAnel      = new THREE.MeshStandardMaterial({ map: texturaAnel, color: 0xcccccc, side: THREE.DoubleSide });
    const matUrano     = new THREE.MeshStandardMaterial({ map: texturaUrano, color: 0x66ffff });
    const matNetuno    = new THREE.MeshStandardMaterial({ map: texturaNetuno, color: 0x3333ff });


    // Criação dos planetas.

    const corpos = []; // Guarda os planetas pra facilitar aplicar a rotação depois.
    const orbitas = []; // Guarda as trajetórias para animar cada planeta.

    function criarCorpo(geometria, material, raio, velocidade) {
      const orbita = new THREE.Object3D();
      scene.add(orbita);
      criarOrbita(raio);

      const mesh = new THREE.Mesh(geometria, material);
      mesh.position.set(raio, 0, 0);
      orbita.add(mesh);
      corpos.push(mesh);
      orbitas.push({ grupo: orbita, velocidade });
      return mesh;
    }

    const sol      = new THREE.Mesh(esferaGeo, matSol);
    scene.add(sol); 
    const mercurio = criarCorpo(esferaGeo, matMercurio,  5, 0.020);
    const venus    = criarCorpo(esferaGeo, matVenus,     7, 0.015);
    const terra    = criarCorpo(esferaGeo, matTerra,     9, 0.012);
    const marte    = criarCorpo(esferaGeo, matMarte,     11, 0.010);
    const jupiter  = criarCorpo(esferaGeo, matJupiter,   15, 0.007);
    const saturno  = criarCorpo(esferaGeo, matSaturno,   19, 0.005);
    const urano    = criarCorpo(esferaGeo, matUrano,     23, 0.0035);
    const netuno   = criarCorpo(esferaGeo, matNetuno,    27, 0.0025);

    // Resumo de cada corpo, mostrado no painel de informações ao clicar
    const infoCorpos = new Map([
      [sol,      { nome: 'Sol',     resumo: 'Estrela no centro do sistema. Sua gravidade mantém todos os planetas em órbita.' }],
      [mercurio, { nome: 'Mercúrio', resumo: 'O menor planeta e o mais próximo do Sol. Não possui atmosfera relevante.' }],
      [venus,    { nome: 'Vênus',    resumo: 'Planeta mais quente do sistema devido ao efeito estufa intenso em sua atmosfera.' }],
      [terra,    { nome: 'Terra',    resumo: 'Único planeta conhecido com vida. Possui 23,5° de inclinação axial.' }],
      [marte,    { nome: 'Marte',    resumo: 'Conhecido como "planeta vermelho" por causa do óxido de ferro em sua superfície.' }],
      [jupiter,  { nome: 'Júpiter',  resumo: 'O maior planeta do sistema solar, um gigante gasoso com dezenas de luas.' }],
      [saturno,  { nome: 'Saturno',  resumo: 'Famoso por seus anéis, formados por gelo e partículas de rocha.' }],
      [urano,    { nome: 'Urano',    resumo: 'Gira praticamente "deitado", com inclinação axial de quase 98°.' }],
      [netuno,   { nome: 'Netuno',   resumo: 'Planeta mais distante do Sol, com os ventos mais fortes do sistema solar.' }],
    ]);

    const painelInfo        = document.getElementById('painelInfo');
    const painelInfoTitulo  = document.getElementById('painelInfoTitulo');
    const painelInfoTexto   = document.getElementById('painelInfoTexto');

    function mostrarInfo(info) {
      if (!info) {
        painelInfo.style.display = 'none';
        return;
      }
      painelInfoTitulo.textContent = info.nome;
      painelInfoTexto.textContent = info.resumo;
      painelInfo.style.display = 'block';
    }


    // anel de Saturno: possui a mesma posição do planeta, mas feito de geometria diferente.
    const anelSaturno = new THREE.Mesh(anelGeo, matAnel);
    saturno.add(anelSaturno);
    anelSaturno.position.set(0, 0, 0);
    // Não está entre a lista de corpos, pois possui rotação própria.


    // Rotação em 3 planetas (inclinação axial real dos planetas)

    terra.rotation.z = 0.41;          // Terra tem ~23,5° de inclinação
    urano.rotation.z = 1.71;          // Urano é o mais inclinado (~98°), "deitado"
    anelSaturno.rotation.x = 1.2;     // inclina o anel pra ficar visível, como na realidade


    // Escala diferente para 3 objetos do cenário.

    sol.scale.set(3, 3, 3);           // Sol é gigante comparado aos planetas
    jupiter.scale.set(2, 2, 2);       // Júpiter é o maior planeta
    mercurio.scale.set(0.4, 0.4, 0.4); // Mercúrio é bem pequeno


    // Sonda controlável pelo usuário (interação por teclado)

    const sondaGeo = new THREE.ConeGeometry(0.5, 1.6, 8);
    const sondaMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const sonda = new THREE.Mesh(sondaGeo, sondaMat);
    sonda.rotation.x = Math.PI / 2; // deixa a ponta do cone apontando pra frente (eixo Z)
    sonda.position.set(0, 4, 32);
    scene.add(sonda);

    const teclas = {};
    window.addEventListener('keydown', (e) => { teclas[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup',   (e) => { teclas[e.key.toLowerCase()] = false; });

    const velocidadeSonda = 0.25;
    function moverSonda() {
      if (teclas['w']) sonda.position.z -= velocidadeSonda;
      if (teclas['s']) sonda.position.z += velocidadeSonda;
      if (teclas['a']) sonda.position.x -= velocidadeSonda;
      if (teclas['d']) sonda.position.x += velocidadeSonda;
    }


    // Interação com o mouse: Raycaster para selecionar planetas ao clicar

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let objetoSelecionado = null;

    function destacarObjeto(objeto, destaque) {
      if (destaque) {
        if (objeto.material.userData.corOriginal === undefined) {
          objeto.material.userData.corOriginal = objeto.material.color.getHex();
        }
        objeto.material.color.setHex(0xffffff); // resposta visual ao clique: objeto "acende"
      } else if (objeto.material.userData.corOriginal !== undefined) {
        objeto.material.color.setHex(objeto.material.userData.corOriginal);
      }
    }

    window.addEventListener('click', (evento) => {
      mouse.x = (evento.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(evento.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (objetoSelecionado) destacarObjeto(objetoSelecionado, false);

      const alvos = [sol, ...corpos];
      const intersecoes = raycaster.intersectObjects(alvos);

      if (intersecoes.length > 0) {
        objetoSelecionado = intersecoes[0].object;
        destacarObjeto(objetoSelecionado, true);
        mostrarInfo(infoCorpos.get(objetoSelecionado)); // exibe o resuminho do corpo clicado
      } else {
        objetoSelecionado = null;
        mostrarInfo(null); // esconde o painel se clicar fora de qualquer corpo
      }
    });


    // Loop na animação.

    function animate() {
      requestAnimationFrame(animate);

      const tempo = relogio.getElapsedTime();

      // rotação própria (em torno do próprio eixo) de cada planeta
      corpos.forEach(corpo => {
        corpo.rotation.y += 0.01;
      });

      orbitas.forEach(orbita => {
        orbita.grupo.rotation.y += orbita.velocidade;
      });

      // Animação baseada em tempo decorrido (Math.sin): o Sol "pulsa" de tamanho
      sol.scale.setScalar(3 + Math.sin(tempo * 2) * 0.15);

      moverSonda(); // atualiza a posição da sonda de acordo com o teclado (WASD)

      controls.update(); // necessário sempre que enableDamping está ativo

      renderer.render(scene, camera);
    }
    animate();


    // Responsividade: permite ajustar a cena quando a janela é redimensionada.

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
